[project]
name = "handover-transcriber"
version = "0.1.0"
description = "Local timeline transcription for handover videos"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "faster-whisper==1.2.1",
  "opencc-python-reimplemented>=0.1.7",
  "rich==15.0.0",
  "typer==0.27.2",
]

[project.scripts]
v2txt = "handover_transcriber.launcher:main"

[dependency-groups]
dev = [
    "pyinstaller==6.22.2",
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.uv.build-backend]
module-name = "handover_transcriber"
module-root = "src"
